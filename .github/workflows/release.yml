name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist -- --publish never

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete $env:GITHUB_REF_NAME --yes --cleanup-tag=false 2>$null || $true
          gh release create $env:GITHUB_REF_NAME `
            --title "lolmasite $env:GITHUB_REF_NAME" `
            --notes "Windows installer release for lolmasite $env:GITHUB_REF_NAME." `
            "release/*.exe" `
            "release/*.exe.blockmap" `
            "release/latest.yml"
